<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 專案生存壓力測試儀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: #eef2ff; /* Light indigo background */
        }
        .tab-button {
            border-bottom-width: 4px;
            transition: all 0.3s ease;
        }
        .tab-button.active {
            box-shadow: 0 6px 16px rgba(49, 46, 129, 0.2);
            transform: translateY(-3px);
            border-bottom-color: #4f46e5;
            background-color: #ffffff;
            color: #4f46e5;
        }
        .analysis-card {
            transition: all 0.5s ease-in-out;
            border-radius: 0.75rem; /* rounded-xl */
        }
        .reality-check-item {
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
            background: #ffffff;
            border-left: 5px solid #ef4444; /* red-500 */
            border-radius: 0.5rem;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .list-item-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
        }
        .card-title-separator {
            border-bottom: 2px solid;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

            </h1>

        </header>

        <!-- Project Overview -->

            </h2>

            </p>
        </div>

        <!-- Module Selector Tabs -->
        <div class="flex flex-col sm:flex-row gap-4 mb-10">
            <button id="tab-A" onclick="switchModule('A')" class="tab-button active flex-1 py-4 px-6 bg-white border-b-4 border-indigo-600 text-indigo-700 text-xl font-bold rounded-lg transition duration-300 hover:bg-indigo-50 shadow-lg">
                模塊 A：個人風格代理 👤
            </button>
            <button id="tab-B" onclick="switchModule('B')" class="tab-button flex-1 py-4 px-6 bg-white border-b-4 border-transparent text-gray-500 text-xl font-bold rounded-lg transition duration-300 hover:bg-gray-50 shadow-lg">
                模塊 B：社交情境模擬器 💬
            </button>
        </div>

        <!-- Analysis Content Area -->
        <div id="content-area" class="space-y-8">
            <!-- Content will be injected here -->
        </div>

        <!-- Valuation Reality Check -->
        <div class="mt-16 pt-8 border-t-2 border-indigo-300">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 flex items-center">
                <span class="mr-3 text-red-600 text-4xl">🔴</span> 投資人最終拷問 (Valuation Reality Check)
            </h2>
            <p class="text-gray-700 mb-5">在功能上做到<strong class="font-semibold">深度垂直</strong>，才能通過我的評估。創業者，你必須回答這幾個關鍵問題：</p>
            <div id="reality-check-list" class="space-y-4">
                <!-- Reality Check questions will be injected here with animations -->
            </div>
        </div>

    </div>

        const realityCheck = [
            "專案 LTV/CAC 估算：你的目標用戶（KOL/品牌小編/公關）願意每月支付多少費用？你預期<strong>獲取一個用戶的成本 (CAC)</strong>是多少？如果 LTV/CAC 低於 3:1，你就是在燒錢玩一個 AI 玩具。",
            "數據護城河：你如何持續、合法、低成本地獲取各平台的留言數據來維持你的『情境模擬器』的準確性？一旦平台 API 收緊或政策改變，你的核心功能是否會立刻死亡？",
            "核心價值：你的 AI 模擬出來的留言，跟一個有經驗的公關人員或社群經理<strong>『猜測』</strong>的留言相比，<strong>精準度高出多少？</strong>如果只高出 10%，客戶會選擇付更高的 AI 訂閱費，還是多請一個有經驗的人？"
        ];

        let currentModule = 'A';
        const contentArea = document.getElementById('content-area');
        const realityCheckList = document.getElementById('reality-check-list');

        /**
         * 渲染分析內容到頁面
         * @param {string} moduleId - 'A' or 'B'
         */
        function renderContent(moduleId) {
            const data = projectData[moduleId];

            // 1. 渲染模塊標題和描述
            let htmlContent = `
                <div class="bg-indigo-700 text-white p-6 rounded-t-xl shadow-inner mb-0">
                    <h3 class="text-3xl font-extrabold mb-1">${data.title}</h3>
                    <p class="opacity-90 text-indigo-200">${data.description}</p>
                </div>
            `;

            // 2. 渲染三個分析卡片
            data.analysis.forEach((item, index) => {
                htmlContent += `
                    <div class="analysis-card ${item.color} border-l-8 p-6 rounded-b-xl shadow-xl transition-all duration-500" style="animation-delay: ${index * 0.15}s;">
                        <p class="text-2xl font-bold mb-3 flex items-center text-gray-900">
                            ${item.label}
                        </p>
                        <div class="text-gray-800 leading-relaxed">
                            ${item.content}
                        </div>
                    </div>
                `;
            });

            // 替換內容，並觸發過渡效果
            contentArea.innerHTML = htmlContent;
        }

        /**
         * 切換模塊 (A/B)
         * @param {string} moduleId - 'A' or 'B'
         */
        function switchModule(moduleId) {
            if (currentModule === moduleId) return;

            // 1. 更新按鈕樣式
            document.getElementById(`tab-${currentModule}`).classList.remove('active', 'border-indigo-600', 'text-indigo-700');
            document.getElementById(`tab-${currentModule}`).classList.add('border-transparent', 'text-gray-500');

            document.getElementById(`tab-${moduleId}`).classList.add('active', 'border-indigo-600', 'text-indigo-700');
            document.getElementById(`tab-${moduleId}`).classList.remove('border-transparent', 'text-gray-500');

            // 2. 更新內容
            currentModule = moduleId;
            renderContent(currentModule);
        }

        /**
         * 渲染投資人拷問
         */
        function renderRealityCheck() {
            let html = '';
            realityCheck.forEach((question, index) => {
                html += `
                    <div class="reality-check-item" style="animation-delay: ${index * 0.3 + 0.5}s;">
                        <p class="font-semibold text-gray-800 leading-relaxed">${question}</p>
                    </div>
                `;
            });
            realityCheckList.innerHTML = html;
        }

        // 初始化：預設顯示模塊 A
        window.onload = function() {
            renderContent(currentModule);
            renderRealityCheck();
        };

    </script>
</body>
</html>
