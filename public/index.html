<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晝夜協奏曲 | 一個可切換的互動世界與專案中心</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="一個可以在賽博龐克的霓虹雨夜與溫柔的日光夢境之間自由切換的互動式個人網站。包含動態天氣與專案連結中心。">
    <meta name="keywords" content="網頁設計, 前端開發, 互動設計, 雙主題, 日夜切換, 賽博龐克, 生活美學, 天氣模擬, 專案集">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* * ===============================================
         * 1. 主題系統：CSS 變數 (CSS Variables)
         * ===============================================
        */
        :root {
            /* 字體 */
            --font-sans: 'Inter', 'Noto Sans TC', sans-serif;
            --font-serif: 'Playfair Display', serif;

            /* 夜晚主題 (預設) - 賽博龐克 */
            --bg-primary: #0f0c29;
            --bg-gradient: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1d194d);
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-glow: #ff00ff; /* 霓虹紫紅 */
            --card-bg: rgba(23, 23, 33, 0.75);
            --card-border: rgba(255, 255, 255, 0.15);
            --card-hover-border: #ff00ff;
            --button-bg: #ff00ff;
            --button-shadow-1: rgba(255, 0, 255, 0.6);
            --button-shadow-2: rgba(255, 0, 255, 0.4);
            --icon-color: #a78bfa;
            --scrollbar-thumb: #ff00ff;
            --scrollbar-track: #111827;
            --rain-color: rgba(170, 200, 255, 0.6);
        }

        body.theme-day {
            /* 白天主題 - 溫暖極簡 */
            --bg-primary: #fdfbfb;
            --bg-gradient: linear-gradient(-45deg, #fdfbfb, #ebedee, #f5f7fa, #fdfbfb);
            --text-primary: #374151;
            --text-secondary: #6b7280;
            --text-glow: #8a6d5c; /* 溫暖陶土色 */
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.08);
            --card-hover-border: #8a6d5c;
            --button-bg: #8a6d5c;
            --button-shadow-1: rgba(138, 109, 92, 0.5);
            --button-shadow-2: rgba(138, 109, 92, 0.3);
            --icon-color: #8a6d5c;
            --scrollbar-thumb: #8a6d5c;
            --scrollbar-track: #f1f5f9;
        }

        /* * ===============================================
         * 2. 基礎與過渡設定
         * ===============================================
        */
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            background-image: var(--bg-gradient);
            background-size: 400% 400%;
            transition: background-color 0.8s ease, color 0.8s ease;
            animation: gradient-animation 25s ease infinite;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        * {
            transition: background-color 0.8s ease, color 0.8s ease, border-color 0.8s ease, box-shadow 0.8s ease, transform 0.4s ease;
        }

        h1, h2, h3, .font-serif {
            font-family: var(--font-serif);
        }

        /* * ===============================================
         * 3. 天氣與光束效果
         * ===============================================
        */
        #weather-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; opacity: 0;
            transition: opacity 0.8s ease;
        }
        body:not(.theme-day) #weather-canvas { opacity: 1; }
        body.theme-day::before {
            content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(255, 255, 220, 0.15) 0%, rgba(255, 255, 220, 0) 40%);
            z-index: 1; pointer-events: none; animation: sunbeam-move 60s linear infinite;
            opacity: 1; transition: opacity 0.8s ease;
        }
        body:not(.theme-day)::before { opacity: 0; }
        @keyframes sunbeam-move {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(10vw, 15vh) rotate(-10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* * ===============================================
         * 4. 元件樣式 (使用 CSS 變數)
         * ===============================================
        */
        .main-container { position: relative; z-index: 10; padding-top: 5rem; padding-bottom: 5rem; }
        .themed-card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); border: 1px solid var(--card-border);
            transition: all 0.4s ease;
        }
        .themed-card:hover {
            transform: translateY(-8px); border-color: var(--card-hover-border);
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.15);
        }
        .themed-title { color: var(--text-primary); text-shadow: 0 0 10px var(--text-glow); }
        .themed-subtitle { color: var(--text-secondary); }
        .themed-button {
            background-color: var(--button-bg); color: var(--bg-primary);
            box-shadow: 0 0 8px var(--button-shadow-1), 0 0 20px var(--button-shadow-2);
            font-weight: 700;
        }
        .themed-button:hover {
             box-shadow: 0 0 12px var(--text-glow), 0 0 30px var(--text-glow);
             transform: scale(1.05);
        }
        .themed-icon { color: var(--icon-color); }
        
        /* Projects Hub 連結列表樣式 (優化版) */
        .project-link-item {
            /* 基礎樣式繼承 themed-card 的邊界 */
            display: block;
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.03); /* 夜晚微光，更低調 */
            color: var(--text-primary);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        body.theme-day .project-link-item {
            background: rgba(0, 0, 0, 0.05); /* 白天陰影，略微可見 */
        }
        .project-link-item:hover {
            background: rgba(var(--card-hover-border-rgb), 0.1); /* 使用主題色變體 */
            box-shadow: 0 0 8px rgba(var(--card-hover-border-rgb), 0.5);
            transform: translateY(-2px);
        }
        /* 定義 RGB 變數，以便在透明背景中使用 */
        :root { --card-hover-border-rgb: 255, 0, 255; } /* 霓虹紫紅 */
        body.theme-day { --card-hover-border-rgb: 138, 109, 92; } /* 溫暖陶土色 */

        /* 滾動條 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar-thumb);
            border-radius: 10px;
            border: 2px solid var(--scrollbar-track);
        }

        /* 初始載入與提示視窗 */
        #entry-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-primary); z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 1; transition: opacity 0.8s ease;
        }
        #entry-overlay.hidden { opacity: 0; pointer-events: none; }

        #theme-toggle-button {
            position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 1000;
            background-color: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body class="antialiased">

    <!-- 天氣效果畫布 -->
    <canvas id="weather-canvas"></canvas>

    <!-- 初始載入畫面 -->
    <div id="entry-overlay">
        <h1 class="text-4xl md:text-6xl font-black uppercase tracking-widest themed-title mb-8">晝夜協奏曲</h1>
        <button id="entry-button" class="px-8 py-3 rounded-full font-bold themed-button text-lg">啟動感官</button>
    </div>



    <!-- 音樂播放器 (由於 Canvas 限制，無法實際播放，但架構保留) -->
    <audio id="night-music" loop preload="metadata" src="https://ia800809.us.archive.org/21/items/synthwave-music-pack/Synthwave%20Music%20Pack/Retrowave.mp3"></audio>
    <audio id="day-music" loop preload="metadata" src="https://ia800504.us.archive.org/3/items/AcousticFolkInstrumental_201804/Acoustic%20Folk%20Instrumental.mp3"></audio>

    <!-- 主容器 -->
    <div class="min-h-screen w-full flex flex-col items-center justify-start p-4 sm:p-6 lg:p-8 main-container">
        <header class="w-full max-w-6xl mx-auto mb-12 text-center">
            <h1 id="main-title" class="text-5xl md:text-7xl font-black uppercase tracking-widest themed-title">PROJECTS HUB</h1>
            <p id="main-subtitle" class="themed-subtitle mt-4 text-md md:text-lg max-w-2xl mx-auto">一個探索數位創作、技術實驗與互動故事的動態檔案庫。</p>
        </header>

        <main id="main-content" class="w-full max-w-6xl mx-auto flex-grow">
            <!-- 搜尋與過濾區域 -->
            <div class="mb-8 px-4">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="搜尋專案名稱、描述或標籤..." class="w-full p-4 pl-12 text-lg rounded-full themed-card border-2 border-transparent focus:border-[var(--card-hover-border)] focus:outline-none">
                    <svg class="w-6 h-6 themed-icon absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>

            <!-- 專案卡片網格 -->
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 專案卡片將由 JavaScript 動態插入此處 -->
            </div>
        </main>

        <footer class="w-full max-w-6xl mx-auto mt-16 pt-8 border-t border-gray-700/50">
            <div class="text-center">
                <p class="themed-subtitle text-sm">&copy; 2024 Digital Nomad. 這是一個持續建構中的互動宇宙。</p>
            </div>
        </footer>
    </div>

    <!-- 主題切換按鈕 -->
    <button id="theme-toggle-button" class="w-16 h-16 rounded-full shadow-xl flex items-center justify-center transition-all duration-500 hover:scale-110" aria-label="切換日夜主題">
        <svg id="moon-icon" class="w-8 h-8 themed-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <svg id="sun-icon" class="w-8 h-8 themed-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
    </button>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- 1. 獲取所有需要的 DOM 元素與全域變數 ---
        const body = document.body;
        const entryOverlay = document.getElementById('entry-overlay');
        const entryButton = document.getElementById('entry-button');
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        const nightMusic = document.getElementById('night-music');
        const dayMusic = document.getElementById('day-music');
        const mainTitle = document.getElementById('main-title');
        const mainSubtitle = document.getElementById('main-subtitle');
        const projectsGrid = document.getElementById('projects-grid');
        const searchInput = document.getElementById('search-input');
        
        let allProjects = []; // 用於存儲所有專案數據

        // --- 2. 天氣效果相關 (保持不變) ---
        const canvas = document.getElementById('weather-canvas');
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let raindrops = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function createRaindrops() {
            raindrops = [];
            for (let i = 0; i < 200; i++) {
                raindrops.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    length: Math.random() * 20 + 10,
                    speed: Math.random() * 5 + 2,
                });
            }
        }

        function drawRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--rain-color').trim();
            ctx.lineWidth = 1;
            ctx.lineCap = 'round';
            raindrops.forEach(p => {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x, p.y + p.length);
                ctx.stroke();
            });
            updateRain();
        }

        function updateRain() {
            raindrops.forEach(p => {
                p.y += p.speed;
                if (p.y > canvas.height) {
                    p.y = 0 - p.length;
                    p.x = Math.random() * canvas.width;
                }
            });
        }

        function startRain() {
            if (body.classList.contains('theme-day')) return;
            createRaindrops();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            function animate() {
                drawRain();
                animationFrameId = requestAnimationFrame(animate);
            }
            animate();
        }

        function stopRain() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        // --- 3. 全新的專案中心 (Projects Hub) 邏輯 ---
        const BACKEND_API_URL = "/api/projects";
        
        async function fetchProjects() {
            try {
                const response = await fetch(BACKEND_API_URL);
                if (!response.ok) {
                    throw new Error(`API 請求失敗: ${response.status}`);
                }
                allProjects = await response.json();
                renderProjects(allProjects);
            } catch (error) {
                console.error("無法獲取專案列表:", error);
                projectsGrid.innerHTML = `<p class="text-red-500 col-span-full text-center">無法載入專案。請檢查後端服務是否正在運行。</p>`;
            }
        }

        function renderProjects(projects) {
            if (!projects.length) {
                projectsGrid.innerHTML = `<p class="themed-subtitle col-span-full text-center">目前沒有可顯示的專案。</p>`;
                return;
            }

            projectsGrid.innerHTML = projects.map(p => {
                const tagsHtml = (p.tags || []).map(tag => 
                    `<span class="text-xs font-medium px-2 py-0.5 rounded-full themed-subtitle opacity-80 border border-[var(--card-border)] mr-2 mb-2">${tag}</span>`
                ).join('');

                return `
                    <a href="./show/${p.filename}" target="_blank" class="themed-card rounded-2xl p-6 flex flex-col group">
                        <h2 class="text-2xl font-bold themed-title mb-2 font-serif group-hover:text-[var(--text-glow)] transition-colors">${p.name}</h2>
                        <p class="themed-subtitle text-sm flex-grow mb-4">${p.desc}</p>
                        <div class="flex flex-wrap items-center mt-auto pt-4 border-t border-[var(--card-border)]">
                            ${tagsHtml}
                        </div>
                    </a>
                `;
            }).join('');
        }

        function setupSearch() {
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const filteredProjects = allProjects.filter(p => {
                    const nameMatch = p.name.toLowerCase().includes(searchTerm);
                    const descMatch = p.desc.toLowerCase().includes(searchTerm);
                    const tagsMatch = (p.tags || []).some(tag => tag.toLowerCase().includes(searchTerm));
                    return nameMatch || descMatch || tagsMatch;
                });
                renderProjects(filteredProjects);
            });
        }

        // --- 4. 主題切換邏輯 (保持不變) ---
        function toggleTheme() {
            body.classList.toggle('theme-day');
            const isDay = body.classList.contains('theme-day');
            
            if (isDay) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
                nightMusic.pause();
                dayMusic.play().catch(e => console.log("Day music play failed:", e));
                stopRain();
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
                dayMusic.pause();
                nightMusic.play().catch(e => console.log("Night music play failed:", e));
                startRain();
            }
            // 主題切換時，重新渲染專案以更新樣式
            renderProjects(allProjects.filter(p => searchInput.value ? p.name.toLowerCase().includes(searchInput.value.toLowerCase()) : true));
        }

        // --- 5. 事件監聽器 ---
        entryButton.addEventListener('click', () => {
            entryOverlay.classList.add('hidden');
            nightMusic.play().catch(e => console.log("Music auto-play prevented."));
            startRain();
        }, { once: true });

        themeToggleButton.addEventListener('click', toggleTheme);

        // --- 6. 初始化頁面 ---
        fetchProjects();
        setupSearch();
    });
    </script>
</body>
</html>
