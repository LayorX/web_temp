
name: Auto-update Project Metadata

on:
  push:
    branches:
      - main
    paths:
      - 'public/show/**.html' # 只在 show 資料夾有新 html 檔案時觸發

jobs:
  update-metadata:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 使用一個穩定的 LTS 版本
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run update script
        run: npm run update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated metadata
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(bot): auto-update project metadata"
          file_pattern: metadata.json
